<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C-Store Promo (spike)</title>
<style>
  /* Fluid sizing: every length derives from --u, 1% of the shorter stage side. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #06122b; }
  body { font-family: Inter, "Noto Sans", system-ui, sans-serif; color: #fff; }
  .stage {
    --u: 1vmin; --cycle: 8s;
    position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(120% 90% at 70% 40%, #1c4fd6 0%, #0b2a7a 45%, #06122b 100%);
    display: grid; grid-template-columns: 46fr 54fr; align-items: center;
  }
  .glow {
    position: absolute; width: 90vmin; height: 90vmin; right: 2vw; top: 50%;
    margin-top: -45vmin;
    animation: pulse var(--cycle) ease-in-out infinite;
  }
  .glow-in { position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(120,190,255,.55), rgba(120,190,255,0) 65%); }
  .copy { padding-left: calc(var(--u) * 8); position: relative; z-index: 2; }
  .price {
    display: flex; align-items: flex-start; font-weight: 900; line-height: .82;
    font-size: calc(var(--u) * 34); letter-spacing: -.04em;
    transform-origin: 0 60%;
    animation: pop var(--cycle) cubic-bezier(.2,1.4,.3,1) infinite;
  }
  .price .slash { font-weight: 300; opacity: .7; margin: 0 calc(var(--u) * 1); }
  .price .cur { font-size: .42em; margin-top: .12em; }
  .line { font-weight: 800; text-transform: uppercase; white-space: nowrap; }
  .l1 { font-size: calc(var(--u) * 5.2); margin-top: calc(var(--u) * 3); color: #ffd84a;
        animation: slide var(--cycle) cubic-bezier(.2,.8,.2,1) infinite; animation-delay: .25s; }
  .l2 { font-size: calc(var(--u) * 8.4); letter-spacing: -.02em;
        animation: slide var(--cycle) cubic-bezier(.2,.8,.2,1) infinite; animation-delay: .4s; }
  .l3 { font-size: calc(var(--u) * 3); font-weight: 500; opacity: .85; text-transform: none;
        animation: slide var(--cycle) cubic-bezier(.2,.8,.2,1) infinite; animation-delay: .55s; }
  .products { position: relative; height: 100%; z-index: 1; }
  .bottle {
    position: absolute; bottom: 9%; height: 70%; aspect-ratio: 1 / 2.8;
    animation: rise var(--cycle) cubic-bezier(.2,1.2,.3,1) infinite;
  }
  .bob { width: 100%; height: 100%; animation: bob 3.2s ease-in-out infinite alternate; }
  .bottle svg { width: 100%; height: 100%; display: block; }
  .b1 { left: 14%; animation-delay: .5s; } .b1 .bob { animation-delay: -.4s; }
  .b2 { left: 36%; height: 80%; z-index: 2; animation-delay: .35s; }
  .b3 { left: 60%; animation-delay: .65s; } .b3 .bob { animation-delay: -1.1s; }
  .badge {
    position: absolute; right: 5%; top: 7%; width: calc(var(--u) * 27); aspect-ratio: 1;
    display: grid; place-items: center; text-align: center; z-index: 3;
    animation: badge var(--cycle) cubic-bezier(.2,1.5,.3,1) infinite; animation-delay: .9s;
  }
  .badge .disc { position: absolute; inset: 6%; border-radius: 50%; background: #fff; }
  .badge .ring { position: absolute; inset: 0; animation: spin 14s linear infinite; }
  .badge .txt { position: relative; color: #c8102e; font-weight: 900; line-height: 1; }
  .badge small { display: block; font-size: calc(var(--u) * 2.4); font-weight: 700; color: #06122b; }
  .badge b { display: block; font-size: calc(var(--u) * 9); letter-spacing: -.03em; }
  .legal {
    position: absolute; left: calc(var(--u) * 8); bottom: calc(var(--u) * 3.5);
    font-size: calc(var(--u) * 1.6); opacity: .7; z-index: 3;
    animation: fade var(--cycle) linear infinite;
  }
  .wipe { position: absolute; inset: 0; background: #06122b; z-index: 9;
          animation: wipe var(--cycle) linear infinite; pointer-events: none; }

  @media (orientation: portrait) {
    .stage { grid-template-columns: 1fr; grid-template-rows: 44fr 56fr; }
    .copy { padding: calc(var(--u) * 10) calc(var(--u) * 8) 0; align-self: start; }
    .glow { right: -10vmin; top: 68%; }
    .badge { top: 40%; right: 6%; }
    .bottle { height: 78%; } .b2 { height: 88%; }
  }

  /* Cycle: in 0-12%, hold to 88%, out to 100%. Transform and opacity only. */
  @keyframes pop   { 0% { transform: scale(.3); opacity: 0 } 12%, 88% { transform: scale(1); opacity: 1 } 96%, 100% { transform: scale(.9); opacity: 0 } }
  @keyframes slide { 0% { transform: translateX(-30vw); opacity: 0 } 12%, 88% { transform: none; opacity: 1 } 96%, 100% { transform: translateX(-8vw); opacity: 0 } }
  @keyframes rise  { 0% { transform: translateY(110%) rotate(8deg); opacity: 0 } 14%, 88% { transform: none; opacity: 1 } 97%, 100% { transform: translateY(30%); opacity: 0 } }
  @keyframes bob   { from { transform: translateY(-1.2%) rotate(-1.2deg) } to { transform: translateY(1.2%) rotate(1.2deg) } }
  @keyframes badge { 0% { transform: scale(0) rotate(-40deg); opacity: 0 } 12%, 88% { transform: none; opacity: 1 } 96%, 100% { transform: scale(.6); opacity: 0 } }
  @keyframes spin  { to { transform: rotate(360deg) } }
  @keyframes pulse { 0%, 100% { transform: scale(.85); opacity: .6 } 50% { transform: scale(1.1); opacity: 1 } }
  @keyframes fade  { 0%, 10% { opacity: 0 } 18%, 88% { opacity: .7 } 96%, 100% { opacity: 0 } }
  @keyframes wipe  { 0% { opacity: 1 } 5%, 95% { opacity: 0 } 100% { opacity: 1 } }

  /* Expensive: the effect sits on the element that moves, so it is recomputed every frame. */
  .v-shadowanim .bob { filter: drop-shadow(0 2vmin 3vmin rgba(0,0,0,.55)); }
  .v-bluranim .glow { filter: blur(4vmin); }
  .v-backdrop .copy::before { content: ""; position: absolute; inset: -4vmin -2vmin -4vmin 2vmin; border-radius: 4vmin;
    background: rgba(255,255,255,.08); backdrop-filter: blur(3vmin); z-index: -1; }

  /* Baked: the same effect on a static child of the moving wrapper, so it is drawn once. */
  .v-shadowbaked .bottle svg { filter: drop-shadow(0 2vmin 3vmin rgba(0,0,0,.55)); overflow: visible; }
  .v-blurbaked .glow-in { filter: blur(4vmin); }
  .v-panel .copy::before { content: ""; position: absolute; inset: -4vmin -2vmin -4vmin 2vmin; border-radius: 4vmin;
    background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04));
    border: .15vmin solid rgba(255,255,255,.18); z-index: -1; }
  .v-extras .badge .disc { box-shadow: 0 1.5vmin 5vmin rgba(0,0,0,.5), 0 0 8vmin rgba(255,255,255,.35); }
  .v-extras .price { text-shadow: 0 1vmin 3vmin rgba(0,0,0,.45); }
  .v-extras .l2 { background: linear-gradient(90deg, #fff, #9fd0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .v-willchange :is(.price, .line, .bottle, .bob, .badge, .ring, .glow, .legal, .wipe) { will-change: transform, opacity; }

  .particle { position: absolute; left: 0; top: 0; width: 1.6vmin; height: 1.6vmin; border-radius: 30%;
    animation: fall linear infinite; z-index: 4; }
  @keyframes fall { from { transform: translate(var(--x), -5vh) rotate(0) } to { transform: translate(calc(var(--x) + var(--dx)), 105vh) rotate(720deg) } }

  /* Variant "layout": the forbidden kind, animating layout properties. */
  .v-layout .price { animation-name: pop-l; }
  .v-layout .l1, .v-layout .l2, .v-layout .l3 { animation-name: slide-l; position: relative; }
  .v-layout .bottle { animation-name: rise-l; }
  .v-layout .bob { animation-name: bob-l; position: relative; }
  @keyframes pop-l   { 0% { font-size: 10vmin; opacity: 0 } 12%, 88% { font-size: 34vmin; opacity: 1 } 96%, 100% { font-size: 30vmin; opacity: 0 } }
  @keyframes slide-l { 0% { left: -30vw; opacity: 0 } 12%, 88% { left: 0; opacity: 1 } 96%, 100% { left: -8vw; opacity: 0 } }
  @keyframes rise-l  { 0% { bottom: -80%; opacity: 0 } 14%, 88% { bottom: 9%; opacity: 1 } 97%, 100% { bottom: -15%; opacity: 0 } }
  @keyframes bob-l   { from { top: -1.2% } to { top: 1.2% } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="bottle" viewBox="0 0 100 280">
    <rect x="36" y="2" width="28" height="22" rx="5" fill="#111"/>
    <path d="M38 24h24v22c0 10 20 18 20 44v170c0 10-8 16-18 16H36c-10 0-18-6-18-16V90c0-26 20-34 20-44z" fill="currentColor"/>
    <path d="M26 96c0-18 14-26 16-40v196c0 8-16 6-16-4z" fill="#fff" opacity=".28"/>
    <rect x="18" y="120" width="64" height="74" fill="#fff" opacity=".92"/>
    <rect x="26" y="134" width="48" height="9" rx="2" fill="currentColor"/>
    <rect x="26" y="150" width="34" height="5" rx="2" fill="#333"/>
    <rect x="26" y="161" width="42" height="5" rx="2" fill="#333"/>
  </symbol>
</svg>

<div class="stage" id="stage">
  <div class="glow"><div class="glow-in"></div></div>
  <div class="copy">
    <div class="price"><span data-f="quantity">2</span><span class="slash">/</span><span class="cur">$</span><span data-f="price">4</span></div>
    <p class="line l1" data-f="promo">Buy any 2</p>
    <p class="line l2" data-f="promoLineOne">Sport Drinks</p>
    <p class="line l3" data-f="promoLineTwo">All flavours, 710 mL</p>
  </div>
  <div class="products">
    <div class="bottle b1" style="color:#19a7ff"><div class="bob"><svg><use href="#bottle"/></svg></div></div>
    <div class="bottle b2" style="color:#27c46b"><div class="bob"><svg><use href="#bottle"/></svg></div></div>
    <div class="bottle b3" style="color:#ff3b4e"><div class="bob"><svg><use href="#bottle"/></svg></div></div>
  </div>
  <div class="badge">
    <div class="disc"></div>
    <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="#c8102e" stroke-width="3" stroke-dasharray="6 5"/></svg>
    <div class="txt"><small>Up to</small><b data-f="points">400</b><small>Points</small></div>
  </div>
  <p class="legal" data-f="disclaimer">Limited time offer. See store for details.</p>
  <div class="wipe"></div>
</div>

<script>
  // Template side of the contract: prepare(data) -> ready -> play -> (report on request).
  const stage = document.getElementById('stage');
  const qs = new URLSearchParams(location.search);
  const groups = { filter: ['shadowanim', 'bluranim', 'backdrop'], baked: ['shadowbaked', 'blurbaked', 'panel'],
                   rich: ['shadowbaked', 'blurbaked', 'panel', 'extras'] };
  for (const v of (qs.get('variant') || 'compositor').split(','))
    for (const c of groups[v] || [v]) stage.classList.add('v-' + c);
  const colors = ['#ffd84a', '#19a7ff', '#27c46b', '#ff3b4e', '#fff'];
  for (let i = 0, n = Number(qs.get('particles') || 0); i < n; i++) {
    const d = document.createElement('div'); d.className = 'particle';
    d.style.cssText = `--x:${(i * 61.8) % 100}vw;--dx:${((i * 37) % 30) - 15}vw;background:${colors[i % 5]};` +
      `animation-duration:${3 + (i % 7) * 0.6}s;animation-delay:-${(i * 0.37) % 6}s`;
    stage.appendChild(d);
  }
  // Particle alternatives that use one layer instead of one layer per element.
  const colorsRgb = [[1, .85, .29], [.1, .65, 1], [.15, .77, .42], [1, .23, .31], [1, 1, 1]];
  function fxCanvas() {
    const c = document.createElement('canvas'); c.width = innerWidth; c.height = innerHeight;
    c.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none';
    stage.appendChild(c); return c;
  }
  const n2d = Number(qs.get('canvas2d') || 0);
  if (n2d) {
    const c = fxCanvas(), g = c.getContext('2d'), W = c.width, H = c.height, sz = Math.min(W, H) * 0.016;
    (function draw(t) {
      g.clearRect(0, 0, W, H);
      for (let i = 0; i < n2d; i++) {
        const dur = 3000 + (i % 7) * 600, k = ((t + i * 370) % dur) / dur;
        g.fillStyle = colors[i % 5];
        g.fillRect(((i * 61.8) % 100) / 100 * W + (((i * 37) % 30) - 15) / 100 * W * k, k * H * 1.1 - sz, sz, sz);
      }
      requestAnimationFrame(draw);
    })(0);
  }
  const ngl = Number(qs.get('webgl') || 0);
  if (ngl) {
    const c = fxCanvas(), gl = c.getContext('webgl', { alpha: true, antialias: false, premultipliedAlpha: true });
    const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, `attribute vec4 a; attribute vec3 col; uniform float t; uniform float size; varying vec3 v;
      void main() { float k = fract((t + a.z) / a.w); v = col;
        gl_Position = vec4((a.x + a.y * k) * 2.0 - 1.0, 1.0 - k * 2.2 + 0.1, 0.0, 1.0); gl_PointSize = size; }`));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `precision mediump float; varying vec3 v; void main() { gl_FragColor = vec4(v, 1.0); }`));
    gl.linkProgram(prog); gl.useProgram(prog);
    const data = new Float32Array(ngl * 7);
    for (let i = 0; i < ngl; i++) {
      const col = colorsRgb[i % 5];
      data.set([((i * 61.8) % 100) / 100, (((i * 37) % 30) - 15) / 100, i * 0.37, 3 + (i % 7) * 0.6, ...col], i * 7);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const la = gl.getAttribLocation(prog, 'a'), lc = gl.getAttribLocation(prog, 'col');
    gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la, 4, gl.FLOAT, false, 28, 0);
    gl.enableVertexAttribArray(lc); gl.vertexAttribPointer(lc, 3, gl.FLOAT, false, 28, 16);
    gl.uniform1f(gl.getUniformLocation(prog, 'size'), Math.min(c.width, c.height) * 0.016);
    const lt = gl.getUniformLocation(prog, 't'); gl.viewport(0, 0, c.width, c.height);
    (function draw(t) {
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform1f(lt, t / 1000); gl.drawArrays(gl.POINTS, 0, ngl);
      requestAnimationFrame(draw);
    })(0);
  }
  const anims = () => document.getAnimations();
  let deltas = [], last = 0, measuring = false;

  function tick(t) {
    if (measuring) { if (last) deltas.push(t - last); last = t; requestAnimationFrame(tick); }
  }
  addEventListener('message', async (e) => {
    const m = e.data || {};
    if (m.type === 'prepare') {
      for (const [k, v] of Object.entries(m.data || {})) {
        const el = document.querySelector(`[data-f="${k}"]`); if (el) el.textContent = v;
      }
      anims().forEach(a => a.pause());
      await document.fonts.ready;
      parent.postMessage({ type: 'ready' }, '*');
    } else if (m.type === 'play') {
      anims().forEach(a => { a.currentTime = 0; a.play(); });
      deltas = []; last = 0; measuring = true; requestAnimationFrame(tick);
    } else if (m.type === 'report') {
      measuring = false;
      parent.postMessage({ type: 'report', deltas }, '*');
    }
  });
  parent.postMessage({ type: 'loaded' }, '*');
</script>
</body>
</html>
