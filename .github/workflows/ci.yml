# Typecheck, lint and test on pull requests that are ready for review, on pushes to master, and
# nightly. docs/ci.md says how it stays fast. A pull request runs only the Turbo tasks of the
# packages its diff affects; a push to master runs those affected since master's last green run; the
# nightly run and a manual run cover everything. Either way, a task whose inputs are unchanged since
# an earlier run replays from the Turbo cache. Performance is not checked here: that is measured on
# the Pi (docs/template-spec.md).
name: CI

# A change to nothing but docs and Markdown starts no run: no package reads them, except fonts/README.md,
# which the compiler's fonts test checks is there. With no required status check (docs/ci.md), nothing
# waits for the run that never starts.
on:
  push:
    branches: [master]
    paths: &code
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - fonts/README.md
  pull_request:
    # ready_for_review: a draft runs nothing, and runs once it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *code
  schedule:
    - cron: "30 7 * * *" # nightly, after the evening's merges (UTC)
  workflow_dispatch:

# By event as well as ref, so a push to master never cancels the nightly or a manual full run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # the plan finds master's last green run; scripts/ci-summary.sh reads this job's step times

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    # A master run with cold caches spends about 16 min on typecheck, test and lint; the CMS e2e takes about 6 beside them since #283 (it took 20, and runs 44896506918, 44908695033 timed out at 30).
    timeout-minutes: 60
    # Turbo's remote cache (docs/ci.md, "Remote cache"). The token goes out only with TURBO_API, so it
    # never reaches Turbo's default server, Vercel's.
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ vars.TURBO_API != '' && secrets.TURBO_TOKEN || '' }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --affected, the format check and the contract check diff against the base
      - uses: pnpm/action-setup@v4 # version from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # The pnpm store: restored on every run, saved only from master, so a pull request never
      # spends a minute uploading it. A lockfile change restores the nearest store and fetches the rest.
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Save pnpm store
        if: github.event_name == 'push' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      # Repo-wide checks: a few seconds each, so they run whole on every change.
      - name: Biome lint
        run: pnpm exec biome lint --error-on-warnings .
      # Only files the change touches: the repo is not formatted wholesale yet (see README).
      - name: Format check
        run: pnpm format:check --since=origin/${{ github.base_ref || 'master' }}
      - name: knip
        run: pnpm knip # unused files, exports and dependencies; knip.jsonc lists what it cannot see
      - name: jscpd
        run: pnpm dupes # copy-paste across apps/ and packages/ may not pass 1% (.jscpd.json)
      - name: Turbo boundaries
        run: pnpm exec turbo boundaries # imports stay inside their package and name declared dependencies
      # A commit that changes packages/contract changes nothing else (AGENTS.md, "The contract leads").
      - name: Contract commits
        run: sh scripts/check-contract-commits.sh ${{ github.event.pull_request.base.sha || github.event.before }}
      # Every template is a devDependency of the API, the cli and the runtime check, whose tests use it, and has browser tests of its own (docs/ci.md).
      - name: Template dependencies
        run: sh scripts/check-template-deps.sh
      # packages/db's import-boundary scan reads every package, which no package graph sees, so it runs
      # on every change rather than only when db is affected (docs/ci.md). About 2 s.
      - name: db import boundary
        run: pnpm --filter @signforge/db exec vitest run --project node
      # The Pi supervisor's tests (device/pi/test_supervisor.py, #558; test_updater.py, #628): unittest against a faked
      # wlr-randr and API, no package to make them affected, so on every change. Well under a second. The update channel
      # checks Ed25519 with python3-cryptography, which Raspberry Pi OS ships; installed here when the runner lacks it.
      - name: Pi supervisor tests
        run: |
          python3 -c 'import cryptography' 2>/dev/null || sudo apt-get install -y -qq python3-cryptography
          python3 -m unittest discover -s device/pi -p 'test_*.py'

      # Which tasks run, whether any of them needs Chromium (the tests of a package that declares a
      # Playwright dependency, or the template harness, launch it), and whether any needs the stress media (the cli's golden
      # test builds examples/stress; the tools' publishing test compares against that golden).
      - name: Plan
        id: plan
        run: |
          # A pull request runs its affected packages' typecheck, tests and lint against the base it
          # merges into; the CMS e2e runs on master, and locally before a pull request is marked ready
          # (docs/ci.md). A push to master runs every task, the e2e included, of the packages affected
          # since the newest master commit whose CI passed: each green run vouches for the one before it,
          # so nothing a red or cancelled run missed goes untested. With no such commit it runs everything,
          # as the nightly and manual runs do. The nightly run is skipped when master has not moved since
          # the last nightly that passed.
          tasks='typecheck test test:e2e lint'
          base=
          affected=
          case $GITHUB_EVENT_NAME in
            pull_request)
              tasks='typecheck test lint'
              base=${{ github.event.pull_request.base.sha }}
              ;;
            push)
              if shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&status=success&per_page=20" \
                --jq '.workflow_runs[] | select(.event != "pull_request") | .head_sha' 2> "$RUNNER_TEMP/runs.err"); then
                for sha in $shas; do
                  if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then base=$sha; break; fi
                done
                [ -n "$base" ] || echo "None of the 20 newest green master runs is on a commit HEAD contains: running everything."
              else
                echo "Could not list master's green runs: $(cat "$RUNNER_TEMP/runs.err"). Running everything."
              fi
              ;;
            schedule)
              last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""') || last=
              if [ "$last" = "$GITHUB_SHA" ]; then
                echo "The last nightly run passed on $GITHUB_SHA: nothing new to run."
                tasks=
              fi
              ;;
          esac
          # Turbo puts the root package.json (the TypeScript compiler most packages use, tsx, the root
          # scripts) and the lockfile's root importer (those versions, and pnpm's) in no package, so
          # --affected would plan nothing for a change to them: run everything instead. ci.yml itself is a
          # global dependency in turbo.json; the other workflows run no task, so they change nothing here.
          root_deps() { git show "$1:pnpm-lock.yaml" | awk '/^  \.:$/ { f = 1; next } /^[^ ]|^  [^ ]/ { f = 0 } f'; }
          if [ -n "$base" ] && { ! git diff --quiet "$base" HEAD -- package.json || [ "$(root_deps "$base")" != "$(root_deps HEAD)" ]; }; then
            echo "The root package.json or the lockfile's root importer changed since $base: running everything."
            base=
          fi
          browsers=false
          stress_media=false
          script_fonts=false
          if [ -n "$tasks" ]; then
            [ -z "$base" ] || affected=--affected
            TURBO_SCM_BASE=$base pnpm exec turbo run $tasks $affected --dry=json > "$RUNNER_TEMP/plan.json"
            for dir in $(jq -r '.tasks[] | select(.command != "<NONEXISTENT>" and (.task == "test" or .task == "test:e2e")) | .directory' "$RUNNER_TEMP/plan.json" | sort -u); do
              grep -qE 'playwright|@signforge/template-test' "$dir/package.json" && browsers=true
              case $dir in packages/cli | packages/tools) stress_media=true ;; templates/alert) script_fonts=true ;; esac
            done
          fi
          {
            echo "base=$base"
            echo "affected=$affected"
            echo "tasks=$tasks"
            echo "browsers=$browsers"
            echo "stress_media=$stress_media"
            echo "script_fonts=$script_fonts"
            echo "playwright=$(sed -n 's/^  playwright-core@\([^:(]*\):.*/\1/p' pnpm-lock.yaml | sort -u | paste -sd- -)"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      # Playwright's headless shell, which every browser test launches, cached per Playwright version.
      # System packages are installed only if the runner lacks a library the shell links against.
      - name: Restore Playwright
        id: browser-cache
        if: steps.plan.outputs.browsers == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.plan.outputs.playwright }}
      - name: Install Playwright
        if: steps.plan.outputs.browsers == 'true'
        run: |
          pnpm --filter @signforge/player exec playwright install --only-shell chromium
          if find ~/.cache/ms-playwright/chromium_headless_shell-* -type f \( -name chrome-headless-shell -o -name headless_shell -o -name '*.so*' \) -exec ldd {} + 2>/dev/null | grep -q 'not found'; then
            pnpm --filter @signforge/player exec playwright install-deps chromium
          fi
      - name: Save Playwright
        if: steps.plan.outputs.browsers == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      # Thai, Arabic and Hebrew fonts for the Alert's browser tests, which check that no real script's marks lose ink to
      # its clipping (docs/ci.md, "Script fonts"): without them those glyphs draw as empty boxes and the test proves nothing.
      - name: Install script fonts
        if: steps.plan.outputs.script_fonts == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-thai-tlwg fonts-noto-core

      # The stress media (docs/ci.md, "Stress media"): the release tarball, cached per version.
      # The script checks every file against examples/stress/media.sha256, cached or not.
      - name: Restore stress media
        id: stress-media-cache
        if: steps.plan.outputs.stress_media == 'true'
        uses: actions/cache/restore@v4
        with:
          path: examples/stress/media
          key: stress-media-${{ hashFiles('examples/stress/media.sha256') }}
      - name: Fetch stress media
        if: steps.plan.outputs.stress_media == 'true'
        run: sh scripts/stress-media.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save stress media
        if: steps.plan.outputs.stress_media == 'true' && steps.stress-media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: examples/stress/media
          key: ${{ steps.stress-media-cache.outputs.cache-primary-key }}

      - name: Typecheck, test, e2e, lint
        if: steps.plan.outputs.tasks != ''
        # One task per core: Turbo's default of 10 starts that many Chromiums on the runner's four cores
        # (two while the repository was private), and browser tests then miss their waits (#277).
        run: pnpm exec turbo run ${{ steps.plan.outputs.tasks }} ${{ steps.plan.outputs.affected }} --summarize --concurrency=100%
        env:
          TURBO_SCM_BASE: ${{ steps.plan.outputs.base }} # what --affected compares against

      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cms-e2e
          path: |
            apps/cms/test-results
            apps/cms/playwright-report
            apps/cms/.e2e
          if-no-files-found: ignore
          include-hidden-files: true # apps/cms/.e2e holds the API's and the CMS's logs
      - name: Timing summary
        if: always()
        run: sh scripts/ci-summary.sh >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          TURBO_SCM_BASE: ${{ steps.plan.outputs.base }}
          NIGHTLY_SKIPPED: ${{ steps.plan.outcome == 'success' && steps.plan.outputs.tasks == '' }}
