# TEMPORARY (#249): times the CMS e2e at 1, 2 and 3 workers on GitHub's runner. Removed before review.
name: e2e timing

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { workers: 1, run: 1 }
          - { workers: 2, run: 1 }
          - { workers: 2, run: 2 }
    name: workers ${{ matrix.workers }} run ${{ matrix.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "v=$(sed -n 's/^  playwright-core@\([^:(]*\):.*/\1/p' pnpm-lock.yaml | sort -u | paste -sd- -)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: pnpm --filter @signforge/player exec playwright install --only-shell chromium
      - name: Runner
        run: echo "nproc=$(nproc)"; free -m
      - name: CMS e2e
        run: |
          # Every 5 s: each process's CPU seconds so far, for the split by kind below.
          (while sleep 5; do ps -eo pid=,cputimes=,args= >> "$RUNNER_TEMP/ps.log"; done) &
          sampler=$!
          read -r _ u0 n0 s0 i0 w0 _ < /proc/stat
          start=$(date +%s)
          rc=0
          pnpm --filter @signforge/cms exec playwright test --workers=${{ matrix.workers }} || rc=$?
          echo "e2e wall: $(( $(date +%s) - start )) s at workers ${{ matrix.workers }}" | tee -a "$GITHUB_STEP_SUMMARY"
          read -r _ u1 n1 s1 i1 w1 _ < /proc/stat
          kill $sampler
          busy=$(( (u1-u0) + (n1-n0) + (s1-s0) )); idle=$(( (i1-i0) + (w1-w0) ))
          echo "CPU busy $(( 100 * busy / (busy + idle) ))% of $(nproc) cores" | tee -a "$GITHUB_STEP_SUMMARY"
          # Each process's last sample, summed by kind (a process shorter than 5 s is missed).
          awk '{ pid=$1; cpu[pid]=$2; $1=""; $2=""; a=$0; k="other";
                 if (a ~ /workerd/) k="workerd"; else if (a ~ /vite/) k="vite"; else if (a ~ /wrangler/) k="wrangler";
                 else if (a ~ /--type=renderer/) k="chromium renderer"; else if (a ~ /--type=gpu/) k="chromium gpu";
                 else if (a ~ /headless_shell|chrome/) k="chromium other"; else if (a ~ /playwright/) k="playwright";
                 kind[pid]=k }
               END { for (p in cpu) t[kind[p]]+=cpu[p]; for (k in t) printf "%7d s %s\n", t[k], k }' "$RUNNER_TEMP/ps.log" | sort -rn | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Upload e2e results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cms-e2e-w${{ matrix.workers }}-r${{ matrix.run }}
          path: |
            apps/cms/test-results
            apps/cms/.e2e
          if-no-files-found: ignore
          include-hidden-files: true # apps/cms/.e2e holds the API's and the CMS's logs
