<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>News</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <header><span class="badge" data-sf="title">Latest news</span><span class="clock" id="clock"></span></header>
  <main>
    <p class="age" id="age"></p>
    <h1 class="lead" id="lead">No headlines yet</h1>
    <ul class="more" id="more"></ul>
  </main>
  <footer>
    <span class="label" id="credit"></span>
    <div class="track"><div class="crawl" id="crawl"></div></div>
  </footer>
</div>
<script type="module" src="main.ts"></script>
</body>
</html>
