<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo Promo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="photo"><img data-sf-src="photo" alt=""></div>
  <div class="shade"></div>
  <div class="copy">
    <p class="eyebrow" data-sf="eyebrow">This week</p>
    <h1 class="headline" data-sf="headline">Fresh picked</h1>
    <p class="body" data-sf="body"></p>
  </div>
  <div class="tag"><span data-sf="price">$3.99</span></div>
</div>
<script type="module" src="main.ts"></script>
</body>
</html>
