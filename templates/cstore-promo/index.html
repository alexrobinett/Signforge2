<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C-Store Promo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="glow"><div class="glow-in"></div></div>
  <div class="copy">
    <div class="price"><span data-sf="quantity">2</span><span class="slash">/</span><span class="cur">$</span><span data-sf="price">4</span></div>
    <p class="line l1" data-sf="promo">Buy any 2</p>
    <p class="line l2" data-sf="product">Sport Drinks</p>
    <p class="line l3" data-sf="detail">All flavours, 710 mL</p>
  </div>
  <div class="products">
    <div class="product p1"><img data-sf-src="imageLeft" alt=""></div>
    <div class="product p2"><img data-sf-src="imageCenter" alt=""></div>
    <div class="product p3"><img data-sf-src="imageRight" alt=""></div>
  </div>
  <div class="badge">
    <div class="disc"></div>
    <div class="txt"><small>Up to</small><b data-sf="points">400</b><small>Points</small></div>
  </div>
  <p class="legal" data-sf="disclaimer"></p>
</div>
<script type="module" src="main.ts"></script>
</body>
</html>
