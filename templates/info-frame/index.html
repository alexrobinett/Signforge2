<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Info frame</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="main">
    <div class="photo-area">
      <section class="panel lk-photo lk-d1">
        <div class="photo-drift"><img class="photo lk-drift" data-sf-src="photo" alt=""></div>
      </section>
      <div class="corner-logo card lk-fade lk-d5" data-show="logo"><img class="logo" data-sf-src="$brand.logo" alt=""></div>
      <div class="chip card lk-badge lk-d4">
        <p class="chip-time" data-show="clock"><span class="time"><span class="hh"></span><span class="colon">:</span><span class="mm"></span></span><span class="ap"></span></p>
        <p class="chip-weather" data-show="weather"><span class="glyph"></span><span class="temp-now"></span><span class="cond"></span></p>
      </div>
      <div class="caption card lk-text lk-d3" data-show="caption">
        <div class="copy">
          <p class="eyebrow" data-show="price"></p>
          <h1 class="title" data-sf="captionTitle">Large coffee and a pastry</h1>
          <p class="line" data-sf="captionLine">Every weekday until 11 am</p>
        </div>
        <div class="price-in lk-badge lk-d5" data-show="price"><p class="price card" data-sf="price"></p></div>
      </div>
    </div>
    <aside class="rail card lk-fade lk-d2">
      <div class="clock card" data-show="clock">
        <div class="lk-mask"><p class="rail-time lk-text lk-d3"><span class="time"><span class="hh"></span><span class="colon">:</span><span class="mm"></span></span><span class="ap"></span></p></div>
        <p class="date lk-fade lk-d3"></p>
        <div class="clock-rule lk-draw lk-d3"></div>
      </div>
      <div class="weather card lk-fade lk-d4" data-show="weather">
        <div class="weather-rule lk-draw lk-d4"></div>
        <p class="place lk-fade lk-d4" data-sf="city"></p>
        <div class="lk-mask"><div class="now lk-text lk-d4"><span class="glyph"></span><span class="temp-now"></span><span class="cond"></span></div></div>
        <p class="wline lk-fade lk-d5"></p>
        <div class="forecast" data-show="forecast"><div class="forecast-rule lk-draw lk-d5"></div><div class="days"></div></div>
      </div>
      <div class="rail-logo card lk-fade lk-d6" data-show="logo"><img class="logo" data-sf-src="$brand.logo" alt=""></div>
    </aside>
  </div>
  <footer class="ticker card lk-fade lk-d5">
    <p class="label card lk-badge lk-d6"><span class="label-text" data-sf="crawlLabel"></span></p>
    <div class="window"><p class="lk-crawl"></p></div>
  </footer>
</div>
<template id="day">
  <div class="day lk-fade"><span class="dname"></span><span class="sky"></span><span class="hi"></span><span class="lo"></span></div>
</template>
<script type="module" src="main.ts"></script>
</body>
</html>
