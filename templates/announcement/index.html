<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Announcement</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <section class="copy">
    <div class="eyebrow lk-mask" data-show="eyebrow"><div class="eyebrow-in lk-badge lk-d1"><span class="pill" data-sf="eyebrow">Company news</span></div></div>
    <img class="logo lk-fade lk-d1" data-show="logo" data-sf-src="$brand.logo" alt="">
    <div class="rule lk-draw lk-d1"></div>
    <div class="headline-box lk-mask"><h1 class="headline lk-text lk-d2" data-sf="headline">Pier 9 opens on Monday</h1></div>
    <p class="body lk-fade lk-d3" data-show="body" data-sf="body"></p>
    <dl class="facts" id="facts" data-show="facts"></dl>
    <div class="foot-rule lk-draw lk-d4"></div>
    <div class="qr lk-fade lk-d5" data-show="qr"><div class="tile" id="qr"></div><p class="qr-label" data-sf="qrLabel"></p></div>
    <div class="meta lk-mask" data-show="meta"><p class="meta-in lk-fade lk-d6" data-sf="meta"></p></div>
  </section>
  <figure class="photo lk-photo lk-d2" data-show="photo">
    <div class="frame"><img class="lk-drift" data-sf-src="photo" alt=""></div>
  </figure>
</div>
<template id="fact"><div class="fact lk-text"><dt></dt><dd></dd></div></template>
<script type="module" src="main.ts"></script>
</body>
</html>
