<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignForge Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .slot { position: fixed; inset: 0; opacity: 0; z-index: 1; overflow: hidden; display: grid; place-items: center; will-change: opacity; }
  /* The black behind a spot is two layers with a 1px gap at the centre, which the spot itself
     covers. A slot on top then never hides the one underneath completely, so Chromium keeps
     drawing (and rendering) the next spot while it loads: see "Playback" in docs/architecture.md. */
  .slot::before, .slot::after { content: ''; position: absolute; top: 0; bottom: 0; background: var(--slot-bg, #000); will-change: transform; }
  .slot::before { left: 0; right: calc(50% + 1px); }
  .slot::after { left: 50%; right: 0; }
  .slot > * { border: 0; display: block; position: relative; z-index: 1; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: #9aa4b2; font: 500 2.4vmin system-ui, sans-serif; text-align: center; white-space: pre-line; }
  /* Pairing (src/pairing.ts): the code, large, on black. The card moves every minute (OLED). */
  #pair { position: fixed; inset: 0; z-index: 50; background: #000; display: none; }
  #pair .card { position: absolute; text-align: center; color: #9aa4b2; font: 500 3vmin system-ui, sans-serif; white-space: nowrap; }
  #pair .code { margin: 2vmin 0; color: #d0d7de; font: 600 16vmin ui-monospace, monospace; letter-spacing: .08em; }
  /* Debug only: a speck that always moves, so the compositor draws every frame and gaps are measurable. */
  #heartbeat { position: fixed; right: 1vmin; bottom: 1vmin; width: 4px; height: 4px; background: #111; z-index: 99; display: none; will-change: transform; animation: hb 1s linear infinite; }
  @keyframes hb { to { transform: rotate(360deg) } }
  #hud { position: fixed; left: 1vmin; top: 1vmin; padding: .6vmin 1vmin; background: rgba(0,0,0,.7); color: #7ee787; font: 1.5vmin ui-monospace, monospace; white-space: pre; z-index: 99; display: none; }
</style>
</head>
<body>
<div id="status">SignForge
Starting…</div>
<div id="pair"></div>
<div id="hud"></div>
<div id="heartbeat"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
