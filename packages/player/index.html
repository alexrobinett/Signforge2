<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignForge Player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .slot { position: fixed; inset: 0; opacity: 0; z-index: 1; overflow: hidden; display: grid; place-items: center; background: #000; will-change: opacity; }
  .slot > * { border: 0; display: block; }
  #status { position: fixed; inset: 0; display: grid; place-items: center; color: #9aa4b2; font: 500 2.4vmin system-ui, sans-serif; text-align: center; white-space: pre-line; }
  /* Debug only: a speck that always moves, so the compositor draws every frame and gaps are measurable. */
  #heartbeat { position: fixed; right: 1vmin; bottom: 1vmin; width: 4px; height: 4px; background: #111; z-index: 99; display: none; will-change: transform; animation: hb 1s linear infinite; }
  @keyframes hb { to { transform: rotate(360deg) } }
  #hud { position: fixed; left: 1vmin; top: 1vmin; padding: .6vmin 1vmin; background: rgba(0,0,0,.7); color: #7ee787; font: 1.5vmin ui-monospace, monospace; white-space: pre; z-index: 99; display: none; }
</style>
</head>
<body>
<div id="status">SignForge
Starting…</div>
<div id="hud"></div>
<div id="heartbeat"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
