<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Look kit test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <main>
    <section class="copy">
      <div class="top">
        <div class="badge lk-badge lk-d1" data-show="eyebrow"><span class="eyebrow lk-wobble" data-sf="eyebrow">Company news</span></div>
        <span class="live lk-fade lk-d1" aria-hidden="true"><i class="ring lk-ping"></i><i class="dot lk-pulse"></i></span>
      </div>
      <div class="rule lk-draw lk-d1"></div>
      <h1 class="headline lk-text lk-d2" data-sf="headline">Pier 9 opens on Monday</h1>
      <p class="body lk-fade lk-d3" data-show="body" data-sf="body"></p>
      <div class="facts lk-text lk-d4"><b class="figure" data-sf="figure">48</b><span class="figure-label" data-sf="figureLabel"></span></div>
      <p class="meta lk-fade lk-d5" data-show="meta" data-sf="meta"></p>
    </section>
    <figure class="photo lk-photo lk-d2" data-show="photo">
      <img class="lk-drift" data-sf-src="photo" alt="">
      <span class="tag lk-badge lk-d6" data-sf="tag">Mon 7 Dec</span>
    </figure>
  </main>
  <footer class="ticker lk-fade lk-d6" data-show="crawl"><span class="lk-crawl" id="crawl" data-sf="crawl"></span></footer>
</div>
<script type="module" src="main.ts"></script>
</body>
</html>
