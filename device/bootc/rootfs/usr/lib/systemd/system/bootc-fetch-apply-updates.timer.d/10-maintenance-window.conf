# Updates apply, and reboot, only in the nightly window, in local time.
# Move it with a higher-numbered drop-in in /etc/systemd/system/bootc-fetch-apply-updates.timer.d/.
[Timer]
OnBootSec=
OnUnitInactiveSec=
OnCalendar=*-*-* 03:00:00
RandomizedDelaySec=30m
# A screen that was off at 03:00 must not update and reboot when it is switched on at noon.
Persistent=false
